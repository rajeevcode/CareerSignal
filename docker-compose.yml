# CareerSignal — dev Docker stack (Supabase-backed).
# Reads secrets from the root .env (gitignored). Web + AI services only;
# Postgres/Auth/Storage are provided by Supabase (hosted or `supabase start`).
#
#   docker compose up --build
#
# Web → http://localhost:3000   AI → http://localhost:8011
services:
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "${AI_PORT:-8011}:8000"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Supabase (server + public). Provide these in the root .env.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      # Talk to the AI container over the compose network.
      AI_SERVICE_URL: http://ai:8000
      NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
    # No bind mount: use the image's installed node_modules + copied source as-built.
    # (Avoids empty named volumes shadowing workspace deps like `postgres`.)
    # The dev target's CMD builds shared/db then runs the Next dev server.
    depends_on:
      ai:
        condition: service_started
