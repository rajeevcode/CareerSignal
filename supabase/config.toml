project_id = "careersignal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Disabled locally — the analytics/vector logging container bind-mounts the
# Docker socket, which the Colima backend does not support.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google OAuth — disabled locally (no credentials). Enable in production by
# setting GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET and enabled = true.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# redirect_uri intentionally omitted — GoTrue derives it from api_external_url
# (http://127.0.0.1:54321/auth/v1/callback). Setting it explicitly can cause the
# CLI/GoTrue to mark the provider disabled in this version.

# LinkedIn OAuth (OpenID Connect). Provider key `linkedin_oidc` (see
# lib/auth/oauth.ts). Provision a LinkedIn app at https://www.linkedin.com/developers,
# request the "Sign In with LinkedIn using OpenID Connect" product, and set
# LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET (exported into the shell that runs
# `supabase start`). Add http://127.0.0.1:54321/auth/v1/callback as an authorized
# redirect URL in the LinkedIn app. Until real creds are set, GoTrue keeps the
# provider disabled and the button shows a friendly "not set up yet" message.
[auth.external.linkedin_oidc]
enabled = true
client_id = "env(LINKEDIN_CLIENT_ID)"
secret = "env(LINKEDIN_CLIENT_SECRET)"
# redirect_uri intentionally omitted — GoTrue derives it from api_external_url,
# same as the Google block above (an explicit value can mark the provider
# disabled in this CLI version).
